[package]
name = "rust-template"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
description = "A Rust project template"
license = "MIT"
# crates.io への誤公開を防ぐ。公開する場合は削除してください。
publish = false

[dependencies]

[build-dependencies]
winresource = "0.1"

[dev-dependencies]

[package.metadata.winresource]
# Windows リソースの著作権表記。`LICENSE` と揃えて更新してください。
LegalCopyright = "Copyright (c) 2026 Your Name"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
