[package]
name = "rust-template"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
authors = ["Your Name <you@example.com>"]
description = "A Rust project template"
license = "MIT"
readme = "README.md"
build = "build.rs"

[dependencies]

[build-dependencies]
winresource = "0.1"

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
debug = false
strip = true
lto = "fat"
incremental = false
codegen-units = 1
